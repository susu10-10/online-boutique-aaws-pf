name: Build and Push Images to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  security-events: write  # Required to upload SARIF files to Security tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          "cartservice",
          "currencyservice",
          "paymentservice",
          "shippingservice",
          "emailservice",
          "checkoutservice",
          "recommendationservice",
          "adservice",
          "loadgenerator"
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::767397659229:role/online-boutique-github-deploy-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Artifacts
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
        run: |
          echo "Building $SERVICE..."
          
          if [ "$SERVICE" == "cartservice" ]; then
            BUILD_DIR="src/$SERVICE/src"
          else
            BUILD_DIR="src/$SERVICE"
          fi
          
          echo "Navigating to $BUILD_DIR..."
          cd $BUILD_DIR
          
          docker build -t $SERVICE:latest .
          
          docker tag $SERVICE:latest $ECR_REGISTRY/online-boutique/$SERVICE:latest
          docker push $ECR_REGISTRY/online-boutique/$SERVICE:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/online-boutique/${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

